<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title>evcc display</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main id="display" class="display">
      <header class="header">
        <div class="title-line">
          <span id="connection-icon" class="connection-icon" aria-hidden="true"></span>
          <h1 id="loadpoint-title">evcc</h1>
        </div>
        <div class="header-meta">
          <span id="battery" class="battery"></span>
          <time id="clock"></time>
        </div>
      </header>

      <section class="content" aria-live="polite">
        <div id="vehicle" class="vehicle"></div>
        <div id="soc-progress" class="soc-progress" role="img" hidden>
          <div id="soc-values" class="soc-values" hidden>
            <span id="soc-limit" hidden></span>
          </div>
          <div class="soc-track">
            <span class="soc-fill"></span>
            <span class="soc-marker" hidden></span>
          </div>
        </div>
        <div id="power-line" class="power-line">
          <span id="soc-group" class="value-group" hidden>
            <span id="soc-value" class="soc-value"></span>
            <span class="power-unit">% SoC</span>
          </span>
          <span id="value-divider" class="value-divider" aria-hidden="true" hidden>·</span>
          <span class="value-group">
            <span id="power" class="power">—</span>
            <span id="power-unit" class="power-unit">kW</span>
            <span id="power-icon" class="power-icon" aria-hidden="true"></span>
          </span>
        </div>
        <p id="status" class="status"></p>
        <div id="energy-flow" class="energy-flow" hidden>
          <div class="bar">
            <span id="bar-fill" class="bar-solar-fill"></span>
            <span id="bar-feed-in-fill" class="bar-feed-in-fill"></span>
            <span id="bar-grid-fill" class="bar-grid-fill"></span>
          </div>
          <div class="bar-labels">
            <span id="bar-left"></span>
            <span id="bar-right"></span>
          </div>
        </div>
        <div id="tiles" class="tiles">
          <article class="tile"><span id="tile-label-0"></span><strong id="tile-value-0"></strong></article>
          <article class="tile"><span id="tile-label-1"></span><strong id="tile-value-1"></strong></article>
          <article class="tile"><span id="tile-label-2"></span><strong id="tile-value-2"></strong></article>
        </div>
      </section>

      <div class="control-row">
        <button id="previous-loadpoint" class="loadpoint-arrow" type="button" aria-label="Previous loadpoint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <nav id="controls" class="controls" aria-label="Charging mode">
          <button type="button" data-mode="smart" disabled><strong data-i18n="smart"></strong><small data-i18n="solarOnly"></small></button>
          <button type="button" data-mode="slow" disabled><strong data-i18n="slow"></strong><small data-i18n="alwaysCharge"></small></button>
          <button type="button" data-mode="fast" disabled><strong data-i18n="fast"></strong><small data-i18n="fullPower"></small></button>
          <button type="button" data-mode="off" disabled><strong data-i18n="off"></strong><small data-i18n="stopCharging"></small></button>
        </nav>
        <button id="next-loadpoint" class="loadpoint-arrow" type="button" aria-label="Next loadpoint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
      </div>
      <nav id="loadpoint-navigation" class="loadpoint-navigation" aria-label="Loadpoint navigation" hidden>
        <div id="dots" class="dots" aria-hidden="true"></div>
      </nav>
      <div id="screen-off" class="screen-off" hidden></div>
      <div id="error" class="error" role="alert" hidden></div>
    </main>
  </body>
</html>
